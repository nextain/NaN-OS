version: "0.1.7"
date: "2026-08-14"
# en/ko are authored here; the remaining release-note languages
# (ja zh fr de ru es ar hi bn pt id vi) are produced through the
# translation cross-review pipeline before the multi-language release page.
summary:
  en: "Korean domestic AI models arrive — Upstage Solar (Pro 4, Mini) and Naver HyperCLOVA X (HCX-007, HCX-DASH-002) are now selectable Naia models with verified tool calling and live pricing. Plus DeepSeek V4 tool calling restored, cleaner first-sentence voice, a durable Radio DJ, and dev/prod instance isolation."
  ko: "국내 AI 모델 합류 — Upstage Solar(Pro 4, Mini)와 Naver HyperCLOVA X(HCX-007, HCX-DASH-002)를 도구 호출·실시간 가격까지 검증해 Naia 모델로 선택 가능. DeepSeek V4 도구 호출 복구, 첫 문장 음성 왜곡 수정, 끊김 없는 라디오 DJ, 개발/운영 인스턴스 격리."
changes:
  # ── AI models (headline) ──
  - type: feat
    scope: models
    description:
      en: "Korean domestic models — Upstage Solar Pro 4 (agent-first flagship) and Solar Mini are now selectable Naia models. Tool calling was verified against the live Upstage deployment before shipping."
      ko: "국내 모델 — Upstage Solar Pro 4(에이전트 특화 플래그십)와 Solar Mini를 Naia 모델로 선택 가능. 배포 전 실제 Upstage 배포본에 도구 호출을 실측 검증했습니다."
  - type: feat
    scope: models
    description:
      en: "Korean domestic models — Naver HyperCLOVA X HCX-007 (reasoning) and HCX-DASH-002 (lightweight) are now selectable Naia models. Tool calling was verified against the live CLOVA Studio deployment before shipping."
      ko: "국내 모델 — Naver HyperCLOVA X HCX-007(추론)와 HCX-DASH-002(경량)를 Naia 모델로 선택 가능. 배포 전 실제 CLOVA Studio 배포본에 도구 호출을 실측 검증했습니다."
  - type: fix
    scope: models
    issue: 436
    description:
      en: "Korean model prices now display — domestic models (Solar, CLOVA) were silently dropped from the price list because only Azure/Vertex routes were recognized; both now show live pricing under Naia."
      ko: "국내 모델 가격 표시 — Azure/Vertex 경로만 인식해 국내 모델(Solar·CLOVA) 가격이 목록에서 조용히 누락되던 문제 수정. 이제 Naia 아래 실시간 가격을 표시합니다."
  - type: fix
    scope: models
    issue: 427
    description:
      en: "DeepSeek V4 (Flash/Pro) tool calling restored — the gateway wrongly refused tool requests, so skills silently never ran on these models. Verified and fixed."
      ko: "DeepSeek V4(Flash/Pro) 도구 호출 복구 — 게이트웨이가 도구 요청을 잘못 거절해 이 모델들에서 스킬이 조용히 실행되지 않던 문제를 실측 확인 후 수정."
  # ── Voice ──
  - type: fix
    scope: voice
    issue: 428
    description:
      en: "Cleaner first sentence — VoxCPM2 no longer distorts a short interjection at the start of a reply; the chunker measures spoken length so emotion tags cannot split a tiny fragment off on its own."
      ko: "첫 문장 깨끗하게 — 답변 첫머리의 짧은 감탄사에서 VoxCPM2가 째지던 문제 수정. 청커가 발화 길이를 기준으로 잘라, 감정 태그가 초단문을 단독 분리하지 못하게 했습니다."
  - type: fix
    scope: voice
    issue: 429
    description:
      en: "Uploaded reference voice sticks — adding your own reference audio no longer gets stomped back to a default preset for the preview and playback."
      ko: "업로드한 레퍼런스 음성 유지 — 직접 추가한 레퍼런스 오디오가 미리듣기·재생에서 기본 프리셋으로 되돌아가던 문제 수정."
  - type: fix
    scope: voice
    issue: 418
    description:
      en: "Local voice readiness is explicit — a single, honest verdict for engine-off vs still-starting, with an in-place start action instead of a generic error."
      ko: "로컬 음성 준비 상태 명확화 — 엔진 꺼짐과 기동 중을 정직하게 구분하고, 일반 오류 대신 그 자리에서 시작하는 동작을 제공합니다."
  # ── Radio DJ / BGM ──
  - type: feat
    scope: radio
    issue: 414
    description:
      en: "Durable continuous Radio DJ — the personal DJ keeps selecting, playing, and commenting across tracks without stalling."
      ko: "끊김 없는 라디오 DJ — 개인 DJ가 곡을 이어 선곡·재생·코멘트하며 멈추지 않습니다."
  - type: fix
    scope: bgm
    description:
      en: "BGM tolerates a cold Windows sidecar startup and no longer false-skips a track that is actually still playing."
      ko: "BGM이 Windows 사이드카 콜드 스타트를 견디고, 실제로 재생 중인 곡을 잘못 건너뛰지 않습니다."
  # ── Dev/prod isolation ──
  - type: feat
    scope: shell
    issue: 425
    description:
      en: "Dev and production instances run side by side — separate app identity, data home, BGM and OAuth ports, while safely sharing the single-GPU voice cascade."
      ko: "개발·운영 인스턴스 동시 실행 — 앱 식별자·데이터 홈·BGM·OAuth 포트를 분리하면서 단일 GPU 음성 cascade는 안전하게 공유합니다."
  # ── Installer / Windows ──
  - type: fix
    scope: installer
    description:
      en: "Windows installer hardening — the Rust agent-pairing gate is synchronized, background process consoles are hidden, and the app boots cleanly on a fresh workspace."
      ko: "Windows 설치본 견고화 — Rust 에이전트 페어링 게이트 동기화, 백그라운드 프로세스 콘솔 숨김, 새 워크스페이스에서 깔끔한 부팅."
