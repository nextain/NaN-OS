name: Naia OS ISO promote

# Makes a built ISO the public download. Run it after booting the build and
# confirming the Naia window actually renders — that is the one check no
# automated gate can make, which is why this is a separate, manual step.
#
# "Naia OS ISO" publishes each build under builds/<version>.<stamp>/ and stops.
# This workflow is the only thing that touches the public name.

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "Build prefix to promote, e.g. builds/0.2.2.20260831T014500Z"
        required: true
      booted:
        description: "Type BOOTED to confirm you started this ISO and saw the Naia window render"
        required: true

permissions:
  contents: read

env:
  R2_PUBLIC: https://pub-affd0538517845d98ce44a5aec11dd98.r2.dev
  R2_BUCKET: s3://naia-releases
  ISO_KEY: naia-os-live-amd64.iso

jobs:
  promote:
    name: Promote a booted ISO to the public download
    runs-on: ubuntu-24.04

    steps:
      # The confirmation is the whole point of this workflow existing. A prefix
      # alone would let it be run reflexively.
      - name: Require the boot confirmation
        run: |
          set -euo pipefail
          test "${{ inputs.booted }}" = "BOOTED" || {
            echo "::error::Type BOOTED to confirm you started this ISO and saw the Naia window render."
            echo "::error::A 1x1 window looks identical to a healthy one in every log."
            exit 1
          }
          case "${{ inputs.prefix }}" in
            builds/*) : ;;
            *) echo "::error::prefix must start with builds/"; exit 1 ;;
          esac

      # The candidate has to be intact before anything is overwritten. This
      # hashes the body rather than trusting the checksum file next to it,
      # because a matching checksum file proves only that two objects agree.
      - name: Verify the candidate before touching the public name
        id: candidate
        run: |
          set -euo pipefail
          BASE="${R2_PUBLIC}/${{ inputs.prefix }}"
          curl -sfL "${BASE}/${ISO_KEY}-CHECKSUM" -o candidate-CHECKSUM || {
            echo "::error::No checksum at ${BASE}/${ISO_KEY}-CHECKSUM — is the prefix right?"
            exit 1
          }
          EXPECTED="$(awk '{print $1}' < candidate-CHECKSUM)"
          echo "Hashing the candidate ISO."
          ACTUAL="$(curl -sfL --retry 3 "${BASE}/${ISO_KEY}" | sha256sum | awk '{print $1}')"
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          test "$EXPECTED" = "$ACTUAL" || {
            echo "::error::The candidate ISO does not match its own checksum. Refusing to promote it."
            exit 1
          }
          echo "sha256=$ACTUAL" >> "$GITHUB_OUTPUT"

      # Timestamped, never a single `previous/` a later run can overwrite with a
      # broken pair. The old pipeline used a fixed path with `|| true`, and
      # `previous/` is empty today after two ISO builds — that is what a
      # swallowed backup failure looks like.
      - name: Back up the currently served pair
        id: backup
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          AWS_REGION: auto
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP="${R2_BUCKET}/previous/${STAMP}"
          if aws s3 ls "${R2_BUCKET}/${ISO_KEY}" >/dev/null 2>&1; then
            aws s3 cp "${R2_BUCKET}/${ISO_KEY}" "${BACKUP}/${ISO_KEY}" --no-progress
            aws s3 cp "${R2_BUCKET}/${ISO_KEY}-CHECKSUM" "${BACKUP}/${ISO_KEY}-CHECKSUM" --no-progress
            aws s3 cp "${BACKUP}/${ISO_KEY}" "${R2_BUCKET}/previous/${ISO_KEY}" --no-progress
            aws s3 cp "${BACKUP}/${ISO_KEY}-CHECKSUM" "${R2_BUCKET}/previous/${ISO_KEY}-CHECKSUM" --no-progress
            echo "path=${BACKUP}" >> "$GITHUB_OUTPUT"
            echo "Backed up to ${BACKUP}/"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "Nothing published yet — no backup to take."
          fi

      # Server-side copies, so no 7GB round trip through the runner.
      #
      # The checksum goes first. The two objects cannot be swapped atomically,
      # so there is a window where they disagree either way; a stale checksum
      # beside a new ISO makes verification fail loudly, while a new checksum
      # beside a stale ISO makes it fail the same way. What matters is that the
      # window is short and that a failure here still has a backup to return to.
      - name: Promote to the public name
        id: promote
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          AWS_REGION: auto
        run: |
          set -euo pipefail
          SRC="${R2_BUCKET}/${{ inputs.prefix }}"
          aws s3 cp "${SRC}/${ISO_KEY}-CHECKSUM" "${R2_BUCKET}/${ISO_KEY}-CHECKSUM" --no-progress
          aws s3 cp "${SRC}/${ISO_KEY}" "${R2_BUCKET}/${ISO_KEY}" --no-progress

      - name: Verify the public download
        id: verify
        run: |
          set -euo pipefail
          BUST="?v=$(date -u +%s)"
          curl -sfL "${R2_PUBLIC}/${ISO_KEY}-CHECKSUM${BUST}" -o public-CHECKSUM
          PUBLIC_SUM="$(awk '{print $1}' < public-CHECKSUM)"
          test "$PUBLIC_SUM" = "${{ steps.candidate.outputs.sha256 }}" \
            || { echo "::error::Public checksum is not the promoted build"; exit 1; }
          echo "Hashing the public ISO."
          BODY_SUM="$(curl -sfL --retry 3 "${R2_PUBLIC}/${ISO_KEY}${BUST}" | sha256sum | awk '{print $1}')"
          echo "promoted: ${{ steps.candidate.outputs.sha256 }}"
          echo "public:   ${BODY_SUM}"
          test "$BODY_SUM" = "${{ steps.candidate.outputs.sha256 }}" \
            || { echo "::error::The public ISO is not the promoted build"; exit 1; }
          echo "Public download is ${{ inputs.prefix }}."

      # Any failure after the backup exists — a half-finished copy, a failed
      # verification — puts the previous pair back. The condition is the backup
      # existing, not the promote step having succeeded: a promote that dies
      # between the two objects is exactly the case that needs this.
      - name: Roll back
        if: failure() && steps.backup.outputs.path != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          AWS_REGION: auto
        run: |
          set -euo pipefail
          BACKUP="${{ steps.backup.outputs.path }}"
          echo "::warning::Restoring the previous public ISO from ${BACKUP}"
          aws s3 cp "${BACKUP}/${ISO_KEY}-CHECKSUM" "${R2_BUCKET}/${ISO_KEY}-CHECKSUM" --no-progress
          aws s3 cp "${BACKUP}/${ISO_KEY}" "${R2_BUCKET}/${ISO_KEY}" --no-progress
          echo "::warning::Rolled back. The public download is the previous ISO."
